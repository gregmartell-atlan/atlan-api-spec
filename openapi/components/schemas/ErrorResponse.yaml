type: object
description: |
  Standard error response envelope for all Atlan API errors.

  Error codes follow the pattern `ATLAS-{status}-{category}-{code}`.
properties:
  errorCode:
    type: string
    description: |
      Atlan internal error code (e.g., `ATLAS-403-00-001`, `ATLAS-500-00-001`).
    example: "ATLAS-403-00-001"
  errorMessage:
    type: string
    description: Human-readable error message.
    example: "Access denied: insufficient permissions to access this asset."
  errorCause:
    type: string
    nullable: true
    description: |
      Optional underlying cause (often a JSON string from a downstream system).
  requestId:
    type: string
    nullable: true
    description: Request ID for support troubleshooting.
required:
  - errorCode
  - errorMessage
