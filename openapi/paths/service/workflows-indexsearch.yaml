post:
  operationId: searchWorkflows
  summary: Search workflows
  description: |
    Search for workflows using an Elasticsearch-style DSL.

    ## Use cases
    - [Manage workflows](https://developer.atlan.com/snippets/workflows/manage/workflows/)
  externalDocs:
    url: https://developer.atlan.com/snippets/workflows/manage/workflows/
    description: Workflow management examples
  tags:
    - "Manage workflows"
    - "Snowflake crawler"
    - "Snowflake miner"
    - "BigQuery crawler"
    - "Redshift crawler"
    - "Databricks crawler"
    - "Databricks miner"
    - "PostgreSQL crawler"
    - "Oracle crawler"
    - "SQL Server crawler"
    - "Athena crawler"
    - "AWS Glue crawler"
    - "DynamoDB crawler"
    - "MongoDB crawler"
    - "Kafka crawler"
    - "dbt crawler"
    - "Looker crawler"
    - "Tableau crawler"
    - "Power BI crawler"
    - "Sigma crawler"
    - "Fivetran enrichment"
    - "Asset import"
    - "Asset export"
    - "Relational assets builder"
    - "Lineage builder"
    - "Lineage generator (no transformation)"
    - "Connection delete"
    - "API token connection admin"
  security:
    - AtlanToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Search.yaml#/WorkflowSearchRequest'
        examples:
          manage_workflows_0:
            summary: "Manage workflows - example 1"
            x-useCaseTag: "Manage workflows"
            x-docUrl: https://developer.atlan.com/snippets/workflows/manage/workflows/
            x-atlanSnippet: |-
              {
                 "from": 0,
                 "size": 1,
                 "track_total_hits": true,
                 "query": {
                     "bool": {
                     "filter": [
                         {
                         "nested": {
                             "path": "metadata",
                             "query": {
                             "bool": {
                                 "must": [
                                 {
                                     "term": {
                                     "metadata.name.keyword": {
                                         "value": "atlan-snowflake-miner-1714638976"
                                          // (1)
                                     }
                                     }
                                 }
                                 ]
                             }
                             }
                         }
                         }
                     ]
                     }
                 },
                 "sort": [
                     {
                     "metadata.creationTimestamp": {
                         "order": "desc",
                         "nested": {
                         "path": "metadata"
                         }
                     }
                     }
                 ]
              }
            value:
              from: 0
              size: 1
              track_total_hits: true
              query:
                bool:
                  filter:
                      - nested:
                          path: metadata
                          query:
                            bool:
                              must:
                                  - term:
                                      metadata.name.keyword:
                                        value: atlan-snowflake-miner-1714638976
              sort:
                  - metadata.creationTimestamp:
                      order: desc
                      nested:
                        path: metadata

          manage_workflows_1:
            summary: "Manage workflows - example 2"
            x-useCaseTag: "Manage workflows"
            x-docUrl: https://developer.atlan.com/snippets/workflows/manage/workflows/
            x-atlanSnippet: |-
              {
                 "from": 0,
                 "size": 5, // (1)
                 "track_total_hits": true,
                 "query": {
                     "bool": {
                     "filter": [
                         {
                         "nested": {
                             "path": "metadata",
                             "query": {
                             "regexp": {
                                 "metadata.name.keyword": {
                                 "value": "atlan[-]snowflake[-]miner[-][0-9]{10}"
                                 } // (2)
                             }
                             }
                         }
                         }
                     ]
                     }
                 },
                 "sort": [
                     {
                     "metadata.creationTimestamp": {
                         "order": "desc",
                         "nested": {
                         "path": "metadata"
