    '400':
      description: Invalid workflow configuration
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '404':
      description: Workflow package not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '500':
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
