post:
  operationId: submitWorkflow
  summary: Submit a workflow for execution
  description: |
    Submit a workflow package for execution with the specified parameters.

    ## Use cases
    - [Workflow packages](https://developer.atlan.com/snippets/workflows/packages/)
    - Crawler configurations
    - Asset import/export
    - Lineage builders
  externalDocs:
    url: https://developer.atlan.com/snippets/workflows/packages/
    description: Workflow package examples
  tags:
    - "Snowflake crawler"
    - "Snowflake miner"
    - "BigQuery crawler"
    - "Redshift crawler"
    - "Databricks crawler"
    - "Databricks miner"
    - "PostgreSQL crawler"
    - "Oracle crawler"
    - "SQL Server crawler"
    - "Athena crawler"
    - "AWS Glue crawler"
    - "DynamoDB crawler"
    - "MongoDB crawler"
    - "Kafka crawler"
    - "dbt crawler"
    - "Looker crawler"
    - "Tableau crawler"
    - "Power BI crawler"
    - "Sigma crawler"
    - "Fivetran enrichment"
    - "Asset import"
    - "Asset export"
    - "Relational assets builder"
    - "Lineage builder"
    - "Lineage generator (no transformation)"
    - "Connection delete"
    - "API token connection admin"
  security:
    - AtlanToken: []
  requestBody:
    required: true
