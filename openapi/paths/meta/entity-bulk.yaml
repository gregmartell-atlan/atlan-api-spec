            errorMessage: "Invalid entity definition: typeName is required"
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '403':
      description: Caller lacks permissions to mutate one or more assets
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
          example:
            errorCode: ATLAS-403-00-001
            errorMessage: "User does not have permission to update entity with guid b9d5dbbc-ee8a-4c5e-a946-a47033892172"
    '500':
      description: Internal error while mutating assets
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'

delete:
  operationId: deleteAssets
  summary: Delete assets in bulk
  description: |
    Soft-delete or permanently purge assets by GUID.

    **Soft delete** (default): Assets are marked as `DELETED` and can be restored.
    **Hard delete**: Assets are permanently removed and cannot be restored.

    ## Use cases
    - [Delete assets](https://developer.atlan.com/snippets/advanced-examples/delete/)
    - [Manage lineage](https://developer.atlan.com/snippets/common-examples/lineage/manage/)
  externalDocs:
    url: https://developer.atlan.com/snippets/advanced-examples/delete/
    description: Deleting an asset – Raw REST API examples
  tags:
    - "Delete assets"
    - "Lineage – Manage"
  security:
    - AtlanToken: []
  parameters:
    - name: guid
      in: query
      required: true
      schema:
        type: array
        items:
          type: string
          format: uuid
      style: form
      explode: true
      description: GUIDs of assets to delete.
    - $ref: '../../components/parameters/_index.yaml#/deleteType'
  responses:
    '200':
      description: Deletion result
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/AssetMutation.yaml#/AssetMutationResponse'
          examples:
            soft_delete:
              summary: Asset soft-deleted
              description: Asset marked as DELETED (can be restored)
              value:
                mutatedEntities:
                  DELETE:
                    - typeName: Table
                      attributes:
                        qualifiedName: default/snowflake/1698696666/ANALYTICS/PUBLIC/OLD_TABLE
                        name: OLD_TABLE
                      guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
                      status: DELETED
            hard_delete:
              summary: Asset permanently purged
              description: Asset permanently removed
              value:
                mutatedEntities:
                  PURGE:
                    - typeName: Table
                      guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
    '400':
      description: Invalid request
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '401':
      description: Missing or invalid token
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '403':
      description: Caller lacks permissions
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
    '404':
      description: Asset not found
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
          example:
            errorCode: ATLAS-404-00-005
            errorMessage: "Given instance guid a1b2c3d4-e5f6-7890-abcd-ef1234567890 is invalid/not found"
    '500':
      description: Internal error
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/ErrorResponse.yaml'
