  responses:
    '200':
      description: Bulk mutation result
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/AssetMutation.yaml#/AssetMutationResponse'
          examples:
            create_table:
              summary: Table created successfully
              description: Response after creating a new table asset
              value:
                mutatedEntities:
                  CREATE:
                    - typeName: Table
                      attributes:
                        qualifiedName: default/snowflake/1698696666/ANALYTICS/PUBLIC/NEW_TABLE
                        name: NEW_TABLE
                      guid: f1g2h3i4-j5k6-7890-lmno-pqrstuvwxyz1
                      status: ACTIVE
                guidAssignments:
                  "-1234567890": f1g2h3i4-j5k6-7890-lmno-pqrstuvwxyz1
            update_description:
              summary: Asset description updated
              description: Response after updating asset metadata
              value:
                mutatedEntities:
                  UPDATE:
                    - typeName: Table
                      attributes:
                        qualifiedName: default/snowflake/1698696666/WIDE_WORLD_IMPORTERS/PROCESSED_GOLD/DIM_CUSTOMER_SP
                        name: DIM_CUSTOMER_SP
                        description: Updated description for customer dimension
                      guid: b9d5dbbc-ee8a-4c5e-a946-a47033892172
                      status: ACTIVE
            add_classification:
              summary: Classification added to asset
              description: Response after adding a tag/classification
              value:
                mutatedEntities:
                  UPDATE:
                    - typeName: Column
                      attributes:
                        qualifiedName: default/snowflake/1698696666/WIDE_WORLD_IMPORTERS/PROCESSED_GOLD/DIM_CUSTOMER_SP/EMAIL
                        name: EMAIL
                      guid: c9d6dcbc-ff9b-5d6e-a057-b47144882061
                      status: ACTIVE
                      classifications:
                        - typeName: PII
                          entityGuid: c9d6dcbc-ff9b-5d6e-a057-b47144882061
                          propagate: true
            link_term:
              summary: Glossary term linked
              description: Response after linking a term to an asset
              value:
                mutatedEntities:
                  UPDATE:
                    - typeName: Table
                      attributes:
                        qualifiedName: default/snowflake/1698696666/ANALYTICS/PUBLIC/CUSTOMERS
                      guid: b9d5dbbc-ee8a-4c5e-a946-a47033892172
                      relationshipAttributes:
                        meanings:
                          - guid: be81ac35-d93f-4b4b-a49a-b1c7046e575d
