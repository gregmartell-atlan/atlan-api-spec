get:
  operationId: getTypeDefs
  summary: Get all type definitions
  description: |
    Retrieve all type definitions from the Atlan instance.
    
    Use the `type` query parameter to filter by type category:
    - `classification` - Tag/classification definitions
    - `businessMetadata` - Custom metadata definitions  
    - `enum` - Enum type definitions
    - `entity` - Entity type definitions
  tags:
    - "Custom metadata structures"
    - "Tag (classification) structures"
  security:
    - AtlanToken: []
  parameters:
    - name: type
      in: query
      description: Filter by type category
      required: false
      schema:
        type: string
        enum:
          - classification
          - businessMetadata
          - enum
          - entity
  responses:
    '200':
      description: All type definitions
      content:
        application/json:
          schema:
            $ref: '../../components/schemas/TypeDefs.yaml#/TypeDefResponse'
          examples:
