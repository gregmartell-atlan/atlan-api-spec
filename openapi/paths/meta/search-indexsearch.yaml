post:
  operationId: searchAssets
  summary: Search for assets
  description: |
    Search Atlan's metadata catalog using an Elasticsearch-style DSL.

    This is the primary search endpoint used throughout Atlan for finding assets,
    filtering by type, status, ownership, tags, and more.

    See [Searching reference](https://developer.atlan.com/search/) for query patterns.

    ## Use cases
    - [Search assets](https://developer.atlan.com/snippets/common-examples/finding/)
    - [Search examples](https://developer.atlan.com/snippets/common-examples/finding/examples/)
  externalDocs:
    url: https://developer.atlan.com/snippets/common-examples/finding/examples/
    description: Search examples and patterns
  tags:
    - "Manage relationships"
    - "Search assets"
    - "Search examples"
    - "Retrieve glossary by name"
    - "Traverse glossary hierarchy"
    - "Manage Data Domains"
    - "Manage Data Products"
    - "Manage personas"
    - "Manage purposes"
    - "Manage policies"
  security:
    - AtlanToken: []
  requestBody:
    required: true
    content:
      application/json:
        schema:
          $ref: '../../components/schemas/Search.yaml#/MetaIndexSearchRequest'
        examples:
          manage_relationships_0:
            summary: "Manage relationships - example 1"
            x-useCaseTag: "Manage relationships"
            x-docUrl: https://developer.atlan.com/snippets/common-examples/relationship-attributes/
            x-atlanSnippet: |-
              {
                 "attributes": [
                   "userDefRelationshipTo",  // (1)
                   "userDefRelationshipFrom" // (2)
                 ],
                 "dsl": {
                   "from": 0,
                   "size": 100,
                   "aggregations": {},
                   "track_total_hits": true,
                   "query": {
                     "bool": {
                       "must": [
                         {
                           "term": {
                             "__superTypeNames.keyword": {
                               "value": "Referenceable"
                             }
                           }
                         }
                       ],
                       "should": [
                         {
                           "term": {
                             "__guid": {
                               "value": "f558a01a-2e16-440c-ba2d-fed2099e540a", // (3)
                               "case_insensitive": false
                             }
                           }
                         },
                         {
                           "term": {
                             "__guid": {
                               "value": "540ee0f6-bb26-4b1a-88b7-31cfc26746b4", // (4)
                               "case_insensitive": false
                             }
                           }
                         }
                       ],
                       "filter": [
                         {
                           "term": {
                             "__superTypeNames.keyword": {
                               "value": "Asset"
                             }
                           }
                         },
                         {
                           "term": {
                             "__state": {
                               "value": "ACTIVE"
                             }
                           }
                         },
                         {
                           "term": {
                             "__superTypeNames.keyword": {
                               "value": "Referenceable"
                             }
                           }
                         }
                       ],
                       "minimum_should_match": 1
                     }
                   },
                   "sort": [
                     {
                       "__guid": {
                         "order": "asc"
                       }
                     }
                   ]
                 },
                 "relationAttributes": [
                   "name"
                 ],
                 "includeRelationshipAttributes": true // (5)
              }
            value:
              attributes:
                  - userDefRelationshipTo
                  - userDefRelationshipFrom
              dsl:
                from: 0
                size: 100
                aggregations: {}
                track_total_hits: true
                query:
                  bool:
                    must:
                        - term:
                            __superTypeNames.keyword:
                              value: Referenceable
                    should:
                        - term:
                            __guid:
                              value: f558a01a-2e16-440c-ba2d-fed2099e540a
                              case_insensitive: false
                        - term:
                            __guid:
                              value: 540ee0f6-bb26-4b1a-88b7-31cfc26746b4
                              case_insensitive: false
                    filter:
                        - term:
                            __superTypeNames.keyword:
                              value: Asset
                        - term:
                            __state:
                              value: ACTIVE
                        - term:
                            __superTypeNames.keyword:
                              value: Referenceable
                    minimum_should_match: 1
                sort:
                    - __guid:
                        order: asc
              relationAttributes:
                  - name
              includeRelationshipAttributes: true

