get:
  operationId: getAssetByGuid
  summary: Retrieve an asset by GUID
  description: |
    Get full details of an asset by its unique identifier (GUID), including
    attributes, relationship attributes, classifications, and custom metadata.

    ## Use cases
    - [Retrieve assets](https://developer.atlan.com/snippets/advanced-examples/read/)
  externalDocs:
    url: https://developer.atlan.com/snippets/advanced-examples/read/
    description: Retrieving an asset – Raw REST API examples
  tags:
    - Retrieve assets
  security:
    - AtlanToken: []
  parameters:
    - $ref: '../../components/parameters/_index.yaml#/guid'
    - $ref: '../../components/parameters/_index.yaml#/minExtInfo'
    - $ref: '../../components/parameters/_index.yaml#/ignoreRelationships'
  responses:
    '200':
      description: Asset details
      content:
        application/json:
          schema:
            type: object
            properties:
              entity:
                $ref: '../../components/schemas/Asset.yaml'
              referredEntities:
                type: object
                additionalProperties:
                  $ref: '../../components/schemas/Asset.yaml'
                description: Related entities referenced by this asset.
          examples:
            table_asset:
              summary: Table asset with full details
              description: A Snowflake table with classifications, owners, and metadata
              value:
                referredEntities: {}
                entity:
                  typeName: Table
                  attributes:
                    qualifiedName: default/snowflake/1698696666/WIDE_WORLD_IMPORTERS/PROCESSED_GOLD/DIM_CUSTOMER_SP
                    name: DIM_CUSTOMER_SP
                    displayName: Customer Dimension
                    description: Dimension table for customer data
                    userDescription: Customer dimension for analytics
                    certificateStatus: VERIFIED
                    certificateStatusMessage: Production-ready
                    ownerUsers:
                      - data.steward@company.com
                    ownerGroups:
                      - Analytics Team
                    connectionQualifiedName: default/snowflake/1698696666
                    connectorName: snowflake
                    databaseName: WIDE_WORLD_IMPORTERS
                    databaseQualifiedName: default/snowflake/1698696666/WIDE_WORLD_IMPORTERS
                    schemaName: PROCESSED_GOLD
