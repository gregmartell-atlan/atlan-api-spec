  - step: 4
    title: Create workflow credentials
    description: "To create workflow credentials for example, for Snowflake:"
    method: POST
    endpoint: /api/service/credentials
    queryString: testCredential=true
    examples:
      - key: example-4-1
        summary: POST /api/service/credentials
        requestRaw: |
          {
              "authType": "basic",// (1)
              "name": "snowflake-credential",
              "connector": "snowflake",
              "connectorConfigName": "atlan-connectors-snowflake",
              "username": "username",
              "password": "password",
              "extra": {
                  "role": "role-here",
                  "warehouse": "warehouse-here"},
              "host": "test-host",
              "port": 1234}
        response:
          id: 972a87c1-28d7-8bf2-896d-ea5bd3e9c691
          name: snowflake-credential
          host: test-host
          port: 1234
          authType: basic
          connectorConfigName: atlan-connectors-snowflake
          isValid: true
          message: Connection successful
