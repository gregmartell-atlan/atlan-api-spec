id: workflows-manage-workflows
title: Manage workflows
category: workflows
icon: zap
relatedTypes:
  - Workflow
  - WorkflowRun
description: Manage workflows in Atlan. Workflows are automated pipelines that run crawlers, sync data, and perform scheduled operations on your data catalog.
externalDocs:
  url: https://developer.atlan.com/snippets/workflows/manage/workflows/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Retrieve workflow
    description: |-
      0.0.16 2.3.1 4.0.0
      Retrieve an existing workflow by its ID:
    method: POST
    endpoint: /api/service/workflows/indexsearch
    examples:
      - key: example-1-1
        summary: POST /api/service/workflows/indexsearch
        request:
          from: 0
          size: 1
          track_total_hits: true
          query:
            bool:
              filter:
                - nested:
                    path: metadata
                    query:
                      bool:
                        must:
                          - term:
                              metadata.name.keyword:
                                value: atlan-snowflake-miner-1714638976
          sort:
            - metadata.creationTimestamp:
                order: desc
                nested:
                  path: metadata
        response:
          approximateCount: 1
          records:
            - _index: atlan-workflow
              _source:
                metadata:
                  name: atlan-snowflake-miner-1714638976
                  namespace: default
                  creationTimestamp: "2024-05-02T10:16:16Z"
                  labels:
                    workflows.argoproj.io/creator: admin
                  annotations:
                    package.argoproj.io/name: "@atlan/snowflake-miner"
                spec:
                  templates:
                    - name: main
                      dag:
                        tasks:
                          - name: run
                            template: snowflake-miner
                  entrypoint: main
                status:
                  phase: Succeeded
                  startedAt: "2024-05-02T10:16:16Z"
                  finishedAt: "2024-05-02T10:25:42Z"
      - key: example-1-2
        summary: POST /api/service/workflows/indexsearch
        request:
          from: 0
          size: 5
          track_total_hits: true
          query:
            bool:
              filter:
                - nested:
                    path: metadata
                    query:
                      regexp:
                        metadata.name.keyword:
                          value: atlan[-]snowflake[-]miner[-][0-9]{10}
          sort:
            - metadata.creationTimestamp:
                order: desc
                nested:
                  path: metadata
        response:
          approximateCount: 5
          records:
            - _index: atlan-workflow
              _source:
                metadata:
                  name: atlan-snowflake-miner-1714638976
                  namespace: default
                  creationTimestamp: "2026-01-15T17:49:40.102Z"
                  labels:
