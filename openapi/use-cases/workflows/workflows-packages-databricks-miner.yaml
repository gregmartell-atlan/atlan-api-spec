id: workflows-packages-databricks-miner
title: Databricks miner package
category: workflows
icon: zap
relatedTypes:
  - Workflow
  - WorkflowRun
description: Configure and run Databricks query history mining package workflows. This package crawls metadata from Databricks and syncs it to your Atlan catalog.
externalDocs:
  url: https://developer.atlan.com/snippets/workflows/packages/databricks-miner/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Re-run existing workflow
    description: "To re-run an existing workflow for databricks assets:"
    notes:
      - type: warning
        title: Workflows run asynchronously
        content: Remember that workflows run asynchronously. See the packages and workflows introduction for details on how you can check the status and wait until the workflow has been completed.
      - type: warning
        title: Requires multiple steps through the raw REST API
        content: Find the existing workflow. Send through the resulting re-run request.
      - type: recommendation
        title: Name of the workflow
        content: The name of the workflow will be nested within the _source.metadata.name property of the response object. (Remember since this is a search, there could be multiple results, so you may want to use the other details in each result to determine which workflow you really want.)
    method: POST
    endpoint: /api/service/workflows/indexsearch
    examples:
      - key: example-1-1
        summary: POST /api/service/workflows/indexsearch
        request:
          from: 0
          size: 5
          query:
            bool:
              filter:
                - nested:
                    path: metadata
                    query:
                      prefix:
                        metadata.name.keyword:
                          value: atlan-databricks-lineage
          sort:
            - metadata.creationTimestamp:
                nested:
                  path: metadata
                order: desc
          track_total_hits: true
        response:
          approximateCount: 5
          records:
            - _index: atlan-workflow
              _source:
                metadata:
                  name: atlan-snowflake-miner-1714638976
                  namespace: default
                  creationTimestamp: "2026-01-15T17:49:40.117Z"
                  labels:
                    workflows.argoproj.io/creator: admin
                  annotations:
                    package.argoproj.io/name: "@atlan/snowflake-miner"
                spec:
                  entrypoint: main
                status:
                  phase: Succeeded
                  startedAt: "2026-01-15T16:49:40.117Z"
                  finishedAt: "2026-01-15T17:49:40.117Z"
      - key: example-1-2
        summary: POST /api/service/workflows/submit
        request:
          namespace: default
          resourceKind: WorkflowTemplate
          resourceName: atlan-databricks-lineage-1684500411
        response:
          approximateCount: 5
          records:
            - _index: atlan-workflow
              _source:
                metadata:
                  name: atlan-snowflake-miner-1714638976
                  namespace: default
                  creationTimestamp: "2026-01-15T17:49:40.117Z"
                  labels:
                    workflows.argoproj.io/creator: admin
                  annotations:
                    package.argoproj.io/name: "@atlan/snowflake-miner"
                spec:
                  entrypoint: main
                status:
                  phase: Succeeded
                  startedAt: "2026-01-15T16:49:40.117Z"
                  finishedAt: "2026-01-15T17:49:40.117Z"
