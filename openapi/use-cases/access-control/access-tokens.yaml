id: access-tokens
title: "API tokens"
category: access-control
icon: zap

description: >-
  API tokens  are a way to provide programmatic access to Atlan without relying on a user's own credentials or permissions.
  
  API tokens are not personal access tokens
  
  API tokens are commonly thought to be synonymous with personal access tokens (PAT). In other words, many developers assume that an API token will have the same privileges and permissions as the user who created them. This is not the case. API tokens are their own unique actor and carry entirely their own set of permissions, complete

