  - step: 4
    title: Update policies
    description: |-
      Different update approach from most assets
      Unlike most assets, to update policies you should first retrieve the existing policy and then update it in its entirety. You can do this by either retrieving the entire policy asset by its GUID (if you know it), or by retrieving the policy using the instructions above under Retrieve policies. You must request at least the attributes defined in that section on each policy to be able to update the policy.
      0.0.15 1.4.0 4.0.0
      To update an existing policies, once you have retrieved it:
    notes:
      - type: warning
        title: Different update approach from most assets
        content: Unlike most assets, to update policies you should first retrieve the existing policy and then update it in its entirety. You can do this by either retrieving the entire policy asset by its GUID (if you know it), or by retrieving the policy using the instructions above under Retrieve policies. You must request at least the attributes defined in that section on each policy to be able to update the policy.
      - type: warning
        title: Multiple API calls required
        content: You will need to first retrieve the policy you want to update. You can then replace any values in the response payload for that policy and POST the revised payload to /api/meta/entity/bulk.
  - step: 5
    title: Remove policies
    description: |-
      To remove a policy, you need only delete it as you would any other asset.
      0.0.15 1.4.0 4.0.0
      To find the GUID of a specific policy in a persona:
    notes:
      - type: warning
        title: Multiple API calls required
        content: You will need to first run a search for all personas with a given name. You can then retrieve the full persona by its GUID, to see all of its policies and their details. You can then iterate through those details to see the displayText for the name that's been given to each policy, and retrieve each policy's guid to be able to individually delete the appropriate policy.
      - type: warning
        title: Multiple API calls required
        content: You will need to first run a search for all purposes with a given name. You can then retrieve the full purpose by its GUID, to see all of its policies and their details. You can then iterate through those details to see the displayText for the name that's been given to each policy, and retrieve each policy's guid to be able to individually delete the appropriate policy.
