id: access-policies
title: Policies
category: access-control
icon: zap
relatedTypes:
  - Asset
  - AuthPolicy
description: Policies control which assets users can access, and what operations they can carry out on those assets.
externalDocs:
  url: https://developer.atlan.com/snippets/access/policies/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Retrieve policies
    description: |-
      0.0.15 1.4.0 4.0.0
      To retrieve a policy from a persona, you need to search for the policy by some characteristic:
    method: POST
    endpoint: /api/meta/search/indexsearch
    examples:
      - key: example-1-1
        summary: POST /api/meta/search/indexsearch
        request:
          dsl:
            query:
              bool:
                filter:
                  - term:
                      __typeName.keyword:
                        value: AuthPolicy
                  - term:
                      __state:
                        value: ACTIVE
                  - term:
                      policyCategory:
                        value: persona
                  - prefix:
                      policyResources:
                        value: entity:default/snowflake/1696324735
            sort:
              - __guid:
                  order: asc
            track_total_hits: true
          attributes:
            - name
            - accessControl
            - policyResources
            - connectionQualifiedName
            - policyType
            - policySubCategory
          relationAttributes:
            - isAccessControlEnabled
            - name
          suppressLogs: true
          showSearchScore: false
          excludeMeanings: false
          excludeClassifications: false
        response:
          queryType: INDEX
          searchParameters:
            showSearchScore: false
            suppressLogs: true
            excludeMeanings: false
            excludeClassifications: false
            allowDeletedRelations: false
            query: "{\"bool\":{\"filter\":[{\"term\":{\"__typeName.keyword\":{\"value\":\"AuthPolicy\"}}},{\"term\":{\"__state\":{\"value\":\"ACTIVE\"}}},{\"term\":{\"policyCategory\":{\"value\":\"persona\"}}},{\"prefix\":{\"policyResources\":{\"value\":\"entity:default/snowflake/1696324735\"}}}]}}"
            attributes:
              - name
              - accessControl
              - policyResources
              - connectionQualifiedName
              - policyType
              - policySubCategory
          approximateCount: 25
          entities:
            - typeName: AuthPolicy
              attributes:
                qualifiedName: default/snowflake/1698696666/ANALYTICS/PUBLIC/AUTHPOLICY_1
                name: AuthPolicy_1
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
              displayText: AuthPolicy_1
            - typeName: AuthPolicy
              attributes:
                qualifiedName: default/snowflake/1698696666/ANALYTICS/PUBLIC/AUTHPOLICY_2
                name: AuthPolicy_2
              guid: abcdef01-2345-6789-abcd-ef000000000001
