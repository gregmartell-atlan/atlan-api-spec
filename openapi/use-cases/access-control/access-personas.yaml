    description: |-
      0.0.12 1.4.0 4.0.0
      To list all the policies in a persona:
    method: POST
    endpoint: /api/meta/search/indexsearch
    examples:
      - key: example-13-1
        summary: POST /api/meta/search/indexsearch
        request:
          dsl:
            query:
              bool:
                filter:
                  - term:
                      __typeName.keyword:
                        value: Persona
                  - term:
                      __state:
                        value: ACTIVE
                  - term:
                      name.keyword:
                        value: Data Assets
            sort:
              - __guid:
                  order: asc
            track_total_hits: true
          attributes:
