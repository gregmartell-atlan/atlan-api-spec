  - step: 14
    title: Personalize the persona
    description: |-
      0.0.12 2.1.4 4.0.0
      To personalize which details to show for assets within a persona:
    notes:
      - type: recommendation
        title: To review available tabs/filters
        content: To review the values of tabs and filters, refer to the SDKs. For example, check the AssetSidebarTab and AssetFilterGroup enums in the SDKs.
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-14-1
        summary: POST /api/meta/entity/bulk
        requestRaw: |
          {
            "entities": [
              {
                "typeName": "Persona",
                "attributes": {
                  "qualifiedName": "default/M5HnBQ8QWhrAVGuvBx8iSW",
                  "name": "Data Assets"
                  "isAccessControlEnabled": true,
                  "denyAssetTabs": [
                    "Lineage",
                    "Relations",
                    "Queries"
                  ],
                  "denyAssetTypes": [
                    "Table",
                    "Column"
                  ],
                  "denyAssetFilters": [
                    "__traitNames",
                    "owners",
                    "certificateStatus"
                  ],
                  "denyCustomMetadataGuids": [
                    "59220d25-5d39-4f3a-8de5-072098bee793",
                    "bb0c9836-94fd-4a54-9007-0f25fb802c2c"
