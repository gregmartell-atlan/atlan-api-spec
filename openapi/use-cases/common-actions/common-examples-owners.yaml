id: common-examples-owners
title: Change owners
category: common-actions
icon: zap
relatedTypes:
  - Asset
description: Manage asset ownership. Assign users or groups as owners of assets to establish accountability and enable proper governance.
externalDocs:
  url: https://developer.atlan.com/snippets/common-examples/owners/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Change an existing asset
    description: |-
      Could create a new asset
      Remember that Atlan matches the provided qualifiedName to determine whether to update or create the asset.
      2.0.0 4.0.0
      To change owners on an existing asset:
    notes:
      - type: warning
        title: Could create a new asset
        content: Remember that Atlan matches the provided qualifiedName to determine whether to update or create the asset.
      - type: warning
        title: Users must be valid
        content: If the user does not exist in Atlan, there will be no updates to the asset. Please verify the usernames or email addresses in Atlan before assigning them to assets.
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-1-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Table
              attributes:
                name: TOP_BEVERAGE_USERS
                qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                ownerUsers:
                  - jsmith
                  - jdoe
        response:
          mutatedEntities:
            UPDATE:
              - typeName: Table
                attributes:
                  qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                  name: TOP_BEVERAGE_USERS
                  ownerUsers:
                    - jsmith
                    - jdoe
                guid: b9d5dbbc-ee8a-4c5e-a946-a47033892172
                status: ACTIVE
  - step: 2
    title: Remove from an existing asset
    description: |-
      2.0.0 4.0.0
      To remove owners from an existing asset:
    notes:
      - type: warning
        title: Users must be valid
        content: If the user does not exist in Atlan, there will be no updates to the asset. Please verify the usernames or email addresses in Atlan before assigning them to assets.
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-2-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Table
              attributes:
                name: TOP_BEVERAGE_USERS
                qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                ownerUsers: []
                ownerGroups: []
        response:
          mutatedEntities:
            DELETE:
              - typeName: Table
                attributes:
                  qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                  name: TOP_BEVERAGE_USERS
                  ownerUsers: []
                  ownerGroups: []
                guid: abcdef01-2345-6789-abcd-ef000000000000
                status: DELETED
  - step: 3
    title: When creating an asset
    description: |-
      2.0.0 4.0.0
      To add owners when creating an asset:
    notes:
      - type: warning
        title: Users must be valid
        content: If the user does not exist in Atlan, there will be no updates to the asset. Please verify the usernames or email addresses in Atlan before assigning them to assets.
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-3-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Table
              attributes:
                name: TOP_BEVERAGE_USERS
                qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                atlanSchema:
                  typeName: Schema
                  uniqueAttributes:
                    qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV
                ownerUsers:
                  - jsmith
                  - jdoe
        response:
          mutatedEntities:
            CREATE:
              - typeName: Table
                attributes:
                  qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                  name: TOP_BEVERAGE_USERS
                  ownerUsers:
                    - jsmith
                    - jdoe
                guid: abcdef01-2345-6789-abcd-ef000000000000
                status: ACTIVE
          guidAssignments:
            "-1234567890": abcdef01-2345-6789-abcd-ef000000000000
