                name: ETL_OUTPUT_PROCESS
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/DW/GOLD/TARGET_TABLE
                name: TARGET_TABLE
                __hasLineage: true
              guid: abcdef01-2345-6789-abcd-ef000000000001
              status: ACTIVE
          hasMore: false
  - step: 8
    title: Limit asset details
    description: |-
      1.4.0 4.0.0
      You can also limit the details for each asset returned by lineage:
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-8-1
        summary: POST /api/meta/lineage/list
