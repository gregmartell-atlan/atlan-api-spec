id: common-examples-lineage-traverse
title: Traverse lineage
category: common-actions
icon: zap
relatedTypes:
  - ColumnProcess
  - Process
description: Traverse lineage graphs. Navigate upstream and downstream lineage to understand data dependencies and impact analysis.
externalDocs:
  url: https://developer.atlan.com/snippets/common-examples/lineage/traverse/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Retrieve lineage
    description: |-
      2.5.3 3.1.1
      To fetch lineage, you need to request lineage from Atlan from a particular starting point:
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-1-1
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: OUTPUT
          from: 0
          size: 10
          attributes:
            - name
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: OUTPUT
            from: 0
            size: 10
          approximateCount: 5
          entities:
            - typeName: ColumnProcess
              attributes:
                qualifiedName: default/snowflake/1698696666/WIDE_WORLD_IMPORTERS/lineage/process_001
                name: ETL_TRANSFORM_CUSTOMERS
              guid: a1b2c3d4-e5f6-7890-abcd-ef1234567890
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/WIDE_WORLD_IMPORTERS/PROCESSED_GOLD/DIM_CUSTOMER
                name: DIM_CUSTOMER
                __hasLineage: true
              guid: b2c3d4e5-f6a7-8901-bcde-f23456789012
              status: ACTIVE
          hasMore: false
  - step: 2
    title: Traverse lineage
    description: |-
      The new lineage list API returns results in breadth-first order. So you can traverse the lineage by progressing through the result list in the order they are returned, even across multiple pages of results.
      2.5.3 3.1.1
      To traverse downstream assets in lineage:
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-2-1
        summary: Downstream lineage traversal
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: OUTPUT
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            direction: OUTPUT
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
                qualifiedName: default/snowflake/lineage/etl_transform
                name: ETL_TRANSFORM
              guid: proc-1234-5678-abcd
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/DW/GOLD/CUSTOMERS_DIM
                name: CUSTOMERS_DIM
              guid: tbl-downstream-001
              status: ACTIVE
          hasMore: false
      - key: example-2-2
        summary: Upstream lineage traversal
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: INPUT
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            direction: INPUT
          approximateCount: 2
          entities:
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/BRONZE/RAW_CUSTOMERS
                name: RAW_CUSTOMERS
              guid: tbl-upstream-001
              status: ACTIVE
          hasMore: false
  - step: 3
    title: Downstream assets
    description: |-
      2.5.3 3.1.1
      To traverse downstream assets in lineage:
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-3-1
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: OUTPUT
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: OUTPUT
            from: 0
            size: 10
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
                qualifiedName: default/snowflake/lineage/process_output
                name: ETL_OUTPUT_PROCESS
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/DW/GOLD/TARGET_TABLE
                name: TARGET_TABLE
                __hasLineage: true
              guid: abcdef01-2345-6789-abcd-ef000000000001
              status: ACTIVE
          hasMore: false
  - step: 4
    title: Upstream assets
    description: |-
      2.5.3 3.1.1
      To traverse upstream assets in lineage:
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-4-1
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: INPUT
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: INPUT
            from: 0
            size: 10
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
                qualifiedName: default/snowflake/lineage/process_input
                name: ETL_INPUT_PROCESS
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/DW/BRONZE/TARGET_TABLE
                name: TARGET_TABLE
