  - step: 5
    title: Filter lineage
    description: |-
      You can also filter the information fetched through lineage. This can help improve performance of your code by limiting the results it will fetch to only those you require.
      Retrieve only active assets
      In most cases for lineage you only care about active assets. By filtering to only active assets, you can improve the performance of lineage retrieval by as much as 10x. (The new FluentLineage interface will do this automatically, unless you explicitly request the inclusion of archived assets.)
      Not possible to filter by custom metadata
      You currently cannot filter lineage based on the values of custom metadata.
      1.9.5 4.0.0
      You can limit the assets you will see in the response through entity filters. These restrict what assets will be included in the results, but still traverse all of the lineage:
    notes:
      - type: recommendation
        title: Retrieve only active assets
        content: In most cases for lineage you only care about active assets. By filtering to only active assets, you can improve the performance of lineage retrieval by as much as 10x. (The new FluentLineage interface will do this automatically, unless you explicitly request the inclusion of archived assets.)
      - type: warning
        title: Not possible to filter by custom metadata
        content: You currently cannot filter lineage based on the values of custom metadata.
      - type: recommendation
        title: FluentLineage.ACTIVE constant
        content: "Note that the FluentLineage.ACTIVE example here is a predefined filter constant. If you look at its code, it is equivalent to writing any other lineage filter: Asset.STATUS.inLineage.eq(AtlanStatus.ACTIVE)"
      - type: recommendation
        title: FluentLineage.ACTIVE constant
        content: "Note that the FluentLineage.ACTIVE example here is a predefined filter constant. If you look at its code, it is equivalent to writing any other lineage filter: Asset.STATUS.in_lineage.eq(EntityStatus.ACTIVE)"
      - type: recommendation
        title: FluentLineage.ACTIVE constant
        content: "Note that the FluentLineage.ACTIVE example here is a predefined filter constant. If you look at its code, it is equivalent to writing any other lineage filter: Asset.STATUS.inLineage.eq(AtlanStatus.ACTIVE)"
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-5-1
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: INPUT
          entityFilters:
            condition: AND
            criterion:
              - attributeName: certificateStatus
                operator: contains
                attributeValue: VERIFIED
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: INPUT
            from: 0
            size: 10
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
                qualifiedName: default/snowflake/lineage/process_input
                name: ETL_INPUT_PROCESS
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/DW/BRONZE/TARGET_TABLE
                name: TARGET_TABLE
                __hasLineage: true
              guid: abcdef01-2345-6789-abcd-ef000000000001
              status: ACTIVE
          hasMore: false
      - key: example-5-2
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: OUTPUT
          entityFilters:
            condition: AND
            criterion:
              - attributeName: __state
                operator: "="
                attributeValue: ACTIVE
          entityTraversalFilters:
            condition: AND
            criterion:
              - attributeName: __state
                operator: "="
                attributeValue: ACTIVE
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: OUTPUT
            from: 0
            size: 10
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
                qualifiedName: default/snowflake/lineage/process_output
                name: ETL_OUTPUT_PROCESS
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/DW/GOLD/TARGET_TABLE
                name: TARGET_TABLE
                __hasLineage: true
              guid: abcdef01-2345-6789-abcd-ef000000000001
              status: ACTIVE
          hasMore: false
      - key: example-5-3
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: OUTPUT
          attributes:
            - description
          from: 0
          size: 10
          excludeClassifications: false
          excludeMeanings: false
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: OUTPUT
            from: 0
            size: 10
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
                qualifiedName: default/snowflake/lineage/process_output
                name: ETL_OUTPUT_PROCESS
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/DW/GOLD/TARGET_TABLE
                name: TARGET_TABLE
                __hasLineage: true
              guid: abcdef01-2345-6789-abcd-ef000000000001
              status: ACTIVE
          hasMore: false
  - step: 6
    title: Limit assets in response
    description: |-
      1.9.5 4.0.0
      You can limit the assets you will see in the response through entity filters. These restrict what assets will be included in the results, but still traverse all of the lineage:
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-6-1
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: INPUT
          entityFilters:
            condition: AND
            criterion:
              - attributeName: certificateStatus
                operator: contains
                attributeValue: VERIFIED
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: INPUT
            from: 0
            size: 10
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
