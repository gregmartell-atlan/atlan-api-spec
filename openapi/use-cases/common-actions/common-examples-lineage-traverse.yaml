                name: ETL_OUTPUT_PROCESS
              guid: abcdef01-2345-6789-abcd-ef000000000000
              status: ACTIVE
            - typeName: Table
              attributes:
                qualifiedName: default/snowflake/1698696666/DW/GOLD/TARGET_TABLE
                name: TARGET_TABLE
                __hasLineage: true
              guid: abcdef01-2345-6789-abcd-ef000000000001
              status: ACTIVE
          hasMore: false
  - step: 9
    title: Original API
    description: |-
      Deprecated and removed
      The original lineage API was previously deprecated, and now no longer exists in the latest releases of the SDKs. It is slower, does not support paging, and will not receive any enhancements. We would therefore strongly recommend using the newer API (described above); however, the original API is described here for completeness.
      To fetch lineage, you need to request lineage from Atlan from a particular starting point:
    notes:
      - type: warning
        title: Deprecated and removed
        content: The original lineage API was previously deprecated, and now no longer exists in the latest releases of the SDKs. It is slower, does not support paging, and will not receive any enhancements. We would therefore strongly recommend using the newer API (described above); however, the original API is described here for completeness.
      - type: warning
        title: If you expect extensive lineage, change the default!
        content: The default value of 0 can result in a long-running API call with a very large response payload. If you expect your lineage to be extensive, you may want to try smaller depths first.
      - type: warning
        title: Use true if you want to use the SDK's traversal helpers
        content: Currently the SDK's traversal logic only works when this is set to true. Unless you want to code your own traversal logic, set hideProcess to true.
      - type: warning
        title: If you expect extensive lineage, change the default!
        content: The default value of 0 can result in a long-running API call with a very large response payload. If you expect your lineage to be extensive, you may want to try smaller depths first.
      - type: warning
        title: Use True if you want to use the SDK's traversal helpers
        content: Currently the SDK's traversal logic only works when this is set to True. Unless you want to code your own traversal logic, set hide_process to True.
      - type: warning
        title: If you expect extensive lineage, change the default!
        content: The default value of 0 can result in a long-running API call with a very large response payload. If you expect your lineage to be extensive, you may want to try smaller depths first.
      - type: recommendation
        title: Multiple API calls
        content: You may either need to make multiple API calls using the approaches above, or retrieve all downstream lineage and in your code traverse the returned relationships.
    method: POST
    endpoint: /api/meta/lineage/getlineage
    examples:
      - key: example-9-1
        summary: POST /api/meta/lineage/getlineage
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 0
          direction: BOTH
          hideProcess: true
          allowDeletedProcess: false
      - key: example-9-2
        summary: POST /api/meta/lineage/getlineage
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1
          direction: OUTPUT
