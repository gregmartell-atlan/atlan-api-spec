  - step: 7
    title: Limit lineage traversal
    description: |-
      1.9.5 4.0.0
      You can also limit how much of the lineage is traversed. You can do this both at an asset-level and a relationship-level:
    method: POST
    endpoint: /api/meta/lineage/list
    examples:
      - key: example-7-1
        summary: POST /api/meta/lineage/list
        request:
          guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
          depth: 1000000
          direction: OUTPUT
          entityFilters:
            condition: AND
            criterion:
              - attributeName: __state
                operator: "="
                attributeValue: ACTIVE
          entityTraversalFilters:
            condition: AND
            criterion:
              - attributeName: __state
                operator: "="
                attributeValue: ACTIVE
          from: 0
          size: 10
          excludeMeanings: true
          excludeClassifications: true
        response:
          searchParameters:
            guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
            depth: 1000000
            direction: OUTPUT
            from: 0
            size: 10
          approximateCount: 3
          entities:
            - typeName: Process
              attributes:
