id: common-examples-custom-metadata
title: Change custom metadata on assets
category: common-actions
icon: zap
relatedTypes:
  - Asset
  - BusinessMetadataDef
  - ClassificationDef
description: Attach and manage custom metadata on assets. Custom metadata allows you to extend Atlan's data model with organization-specific attributes.
externalDocs:
  url: https://developer.atlan.com/snippets/common-examples/custom-metadata/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Value representation
    description: |-
      To update custom metadata values on an asset, you need to use the correct representation:
      Multi-value attributes
      Custom attributes in Atlan can be configured to allow multiple values. For these, you must wrap all values in a multi-valued collection, even if there is only a single value you are setting. Each value in that collection needs to follow the appropriate representation as indicated in the table above.
      For example, if you want to set just a single group in a field that allows multiple values:
    notes:
      - type: warning
        title: Multi-value attributes
        content: |-
          Custom attributes in Atlan can be configured to allow multiple values. For these, you must wrap all values in a multi-valued collection, even if there is only a single value you are setting. Each value in that collection needs to follow the appropriate representation as indicated in the table above. For example, if you want to set just a single group in a field that allows multiple values:

           dbt

           Java

           Python

