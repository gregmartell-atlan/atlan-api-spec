  - step: 3
    title: Using OpenLineage
    description: You must first configure OpenLineage before creating lineage between assets. You can either configure a Spark Assets  connection in Atlan before sending any OpenLineage events. (You can skip the Configure the integration in Apache Spark section), or you can follow the steps below to create the Spark connection via SDKs.
    method: POST
    endpoint: /api/service/credentials
    queryString: testCredential=true
    examples:
      - key: example-3-1
        summary: POST /api/service/credentials
        requestRaw: |
          {
              "authType": "atlan_api_key",// (1)
              "name": "default-spark-1716979138-0",
              "connector": "spark",
              "connectorConfigName": "atlan-connectors-spark",
              "connectorType": "event",
              "extra": {
                  "events.enable-partial-assets": true,
                  "events.enabled": true,
                  "events.topic": "openlineage_spark",
                  "events.urlPath": "/events/openlineage/spark/api/v1/lineage"// (7)
              }
          }
        response:
          id: 972a87c1-28d7-8bf2-896d-ea5bd3e9c691
          name: default-spark-1716979138-0
          host: example.host.com
          port: 443
          authType: atlan_api_key
          connectorConfigName: atlan-connectors-spark
          isValid: true
          message: Connection successful
      - key: example-3-2
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Connection
              attributes:
                name: open_lineage_connection
                connectorName: spark
                qualifiedName: default/spark/123456789
                category: connector
                defaultCredentialGuid: 8b579147-6054-4a4c-8137-463cd349b393
                adminRoles:
                  - e7ae0295-c60a-469a-bd2c-fb903943aa02
                adminGroups:
                  - group2
                adminUsers:
                  - jsmith
        response:
          id: 972a87c1-28d7-8bf2-896d-ea5bd3e9c691
          name: credential-name
          host: example.host.com
          port: 443
          authType: basic
          connectorConfigName: atlan-connectors-snowflake
          isValid: true
          message: Connection successful
  - step: 4
    title: Create lineage between columns
    description: |-
      2.0.0 4.0.0
      To create lineage between relational asset columns, it is necessary to create a ColumnProcess entity.
      Lineage with relational columns
      Before creating the ColumnProcess, verify lineage already exists between the associated relational assets, and ensure that the columns referenced as inputs and outputs already exist.
    notes:
      - type: warning
        title: Lineage with relational columns
        content: Before creating the ColumnProcess, verify lineage already exists between the associated relational assets, and ensure that the columns referenced as inputs and outputs already exist.
      - type: recommendation
        title: Tips for the connection
        content: |-
          The column process itself must be created within a connection for both access control and icon labelling. Use a connection qualifiedName that indicates the system that ran the column process:
          You could use the same connection qualifiedName as the source system, if it was the source system "pushing" data to the target(s). You could use the same connection qualifiedName as the target system, if it was the target system "pulling" data from the source(s). You could use a different connection qualifiedName from either source or target, if there is a system in-between doing the processing (for example an ETL engine or orchestrator).
      - type: recommendation
        title: Use your own ID if you can
        content: While the SDK can generate this ID for you, since it is based on the unique combination of inputs and outputs the ID can change if those inputs or outputs change. This could result in extra column processes in lineage as this process itself changes over time. By using your own ID for the column process, any changes that occur in that process over time (even if the inputs or outputs change) the same single process in Atlan will be updated.
      - type: recommendation
        title: Tips for the connection
        content: |-
          The column process itself must be created within a connection for both access control and icon labelling. Use a connection qualified_name that indicates the system that ran the column process:
          You could use the same connection qualified_name as the source system, if it was the source system "pushing" data to the target(s). You could use the same connection qualified_name as the target system, if it was the target system "pulling" data from the source(s). You could use a different connection qualified_name from either source or target, if there is a system in-between doing the processing (for example an ETL engine or orchestrator).
      - type: recommendation
        title: Use your own ID if you can
        content: While the SDK can generate this ID for you, since it is based on the unique combination of inputs and outputs the ID can change if those inputs or outputs change. This could result in extra column processes in lineage as this column process itself changes over time. By using your own ID for the column process, any changes that occur in that column process over time (even if the inputs or outputs change) the same single column process in Atlan will be updated.
      - type: recommendation
        title: Tips for the connection
        content: |-
          The column process itself must be created within a connection for both access control and icon labelling. Use a connection qualifiedName that indicates the system that ran the column process:
          You could use the same connection qualifiedName as the source system, if it was the source system "pushing" data to the target(s). You could use the same connection qualifiedName as the target system, if it was the target system "pulling" data from the source(s). You could use a different connection qualifiedName from either source or target, if there is a system in-between doing the processing (for example an ETL engine or orchestrator).
      - type: recommendation
        title: Use your own ID if you can
        content: While the SDK can generate this ID for you, since it is based on the unique combination of inputs and outputs the ID can change if those inputs or outputs change. This could result in extra column processes in lineage as this process itself changes over time. By using your own ID for the column process, any changes that occur in that process over time (even if the inputs or outputs change) the same single process in Atlan will be updated.
      - type: warning
        title: You must first configure OpenLineage
        content: You must first configure a Spark Assets  connection in Atlan before sending any OpenLineage events. (You can skip the Configure the integration in Apache Spark section.)
      - type: recommendation
        title: Create input fields from input datasets
        content: You can quickly create such a input (source) field from an input dataset using the fromField() method and the name of the column in that input dataset.
      - type: recommendation
        title: Create input fields from input datasets
        content: You can quickly create such a input (source) field from an input dataset using the from_Field() method and the name of the column in that input dataset.
      - type: recommendation
        title: Create input fields from input datasets
        content: You can quickly create such a input (source) field from an input dataset using the fromField() method and the name of the column in that input dataset.
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-4-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: ColumnProcess
              attributes:
                name: Source 1, Source 2, Source 3 -> Target 1, Target 2
                qualifiedName: default/snowflake/1657025257/dag_123
                inputs:
                  - typeName: Column
                    guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
                  - typeName: Column
                    guid: d002dead-1655-4d75-abd6-ad889fa04bd4
                  - typeName: Column
                    uniqueAttributes:
                      qualifiedName: default/snowflake/1657025257/OPS/DEFAULT/RUN_STATS
                outputs:
                  - typeName: Column
                    guid: 86d9a061-7753-4884-b988-a02d3954bc24
                  - typeName: Column
                    uniqueAttributes:
                      qualifiedName: default/snowflake/1657025257/OPS/DEFAULT/FULL_STATS
                process:
                  guid: 76d9a061-7753-9884-b988-a02d3954bc25
                  typeName: Process
                  uniqueAttributes:
                    qualifiedName: default/snowflake/1657025257/parent_123
        response:
          mutatedEntities:
            CREATE:
              - typeName: ColumnProcess
                attributes:
                  qualifiedName: default/snowflake/1657025257/dag_123
                  name: Source 1, Source 2, Source 3 -> Target 1, Target 2
                guid: abcdef01-2345-6789-abcd-ef000000000000
                status: ACTIVE
          guidAssignments:
            "-1234567890": abcdef01-2345-6789-abcd-ef000000000000
