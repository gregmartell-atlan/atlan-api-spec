id: common-examples-lineage-manage
title: Manage lineage
category: common-actions
icon: zap
relatedTypes:
  - Asset
  - ColumnProcess
  - Process
description: Create and manage data lineage. Lineage tracks how data flows through your organization, connecting source assets to target assets through transformation processes.
externalDocs:
  url: https://developer.atlan.com/snippets/common-examples/lineage/manage/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Create lineage between assets
    description: |-
      7.0.0 4.0.0
      To create lineage between assets, you need to create a Process entity.
      Input and output assets must already exist
      Note that the assets you reference as the inputs and outputs of the process must already exist, before creating the process.
    notes:
      - type: warning
        title: Input and output assets must already exist
        content: Note that the assets you reference as the inputs and outputs of the process must already exist, before creating the process.
      - type: recommendation
        title: Tips for the connection
        content: |-
          The process itself must be created within a connection for both access control and icon labelling. Use a connection qualifiedName that indicates the system that ran the process:
          You could use the same connection qualifiedName as the source system, if it was the source system "pushing" data to the target(s). You could use the same connection qualifiedName as the target system, if it was the target system "pulling" data from the source(s). You could use a different connection qualifiedName from either source or target, if there is a system in-between doing the processing (for example an ETL engine or orchestrator).
      - type: recommendation
        title: Use your own ID if you can
        content: While the SDK can generate this ID for you, since it is based on the unique combination of inputs and outputs the ID can change if those inputs or outputs change. This could result in extra processes in lineage as this process itself changes over time. By using your own ID for the process, any changes that occur in that process over time (even if the inputs or outputs change) the same single process in Atlan will be updated.
      - type: recommendation
        title: Tips for the connection
        content: |-
          The process itself must be created within a connection for both access control and icon labelling. Use a connection qualified_name that indicates the system that ran the process:
          You could use the same connection qualified_name as the source system, if it was the source system "pushing" data to the target(s). You could use the same connection qualified_name as the target system, if it was the target system "pulling" data from the source(s). You could use a different connection qualified_name from either source or target, if there is a system in-between doing the processing (for example an ETL engine or orchestrator).
      - type: recommendation
        title: Use your own ID if you can
        content: While the SDK can generate this ID for you, since it is based on the unique combination of inputs and outputs the ID can change if those inputs or outputs change. This could result in extra processes in lineage as this process itself changes over time. By using your own ID for the process, any changes that occur in that process over time (even if the inputs or outputs change) the same single process in Atlan will be updated.
      - type: recommendation
        title: Tips for the connection
        content: |-
          The process itself must be created within a connection for both access control and icon labelling. Use a connection qualifiedName that indicates the system that ran the process:
          You could use the same connection qualifiedName as the source system, if it was the source system "pushing" data to the target(s). You could use the same connection qualifiedName as the target system, if it was the target system "pulling" data from the source(s). You could use a different connection qualifiedName from either source or target, if there is a system in-between doing the processing (for example an ETL engine or orchestrator).
      - type: recommendation
        title: Use your own ID if you can
        content: While the SDK can generate this ID for you, since it is based on the unique combination of inputs and outputs the ID can change if those inputs or outputs change. This could result in extra processes in lineage as this process itself changes over time. By using your own ID for the process, any changes that occur in that process over time (even if the inputs or outputs change) the same single process in Atlan will be updated.
      - type: warning
        title: Warning
        content: "Note: At least one of the optional parameters admin_roles, admin_users, or admin_groups must be provided to successfully create the connection."
      - type: recommendation
        title: Determines the icon
        content: This determines the icon that Atlan will use for all the assets in the connection. If you use a value that is not a known value, you will have a default gear icon instead.
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-1-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Process
              attributes:
                name: Source 1, Source 2, Source 3 -> Target 1, Target 2
                qualifiedName: default/snowflake/1657025257/dag_123
                inputs:
                  - typeName: Table
                    guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
                  - typeName: Table
                    guid: d002dead-1655-4d75-abd6-ad889fa04bd4
                  - typeName: Table
                    uniqueAttributes:
                      qualifiedName: default/snowflake/1657025257/OPS/DEFAULT/RUN_STATS
                outputs:
                  - typeName: Table
                    guid: 86d9a061-7753-4884-b988-a02d3954bc24
                  - typeName: Table
                    uniqueAttributes:
                      qualifiedName: default/snowflake/1657025257/OPS/DEFAULT/FULL_STATS
        response:
          mutatedEntities:
            CREATE:
              - typeName: Process
                attributes:
                  qualifiedName: default/snowflake/1657025257/dag_123
                  name: Source 1, Source 2, Source 3 -> Target 1, Target 2
                guid: abcdef01-2345-6789-abcd-ef000000000000
                status: ACTIVE
          guidAssignments:
            "-1234567890": abcdef01-2345-6789-abcd-ef000000000000
      - key: example-1-2
        summary: POST /api/service/credentials
        requestRaw: |
          {
              "authType": "atlan_api_key",// (1)
              "name": "default-spark-1716979138-0",
              "connector": "spark",
              "connectorConfigName": "atlan-connectors-spark",
              "connectorType": "event",
              "extra": {
                  "events.enable-partial-assets": true,
                  "events.enabled": true,
                  "events.topic": "openlineage_spark",
                  "events.urlPath": "/events/openlineage/spark/api/v1/lineage"// (7)
              }
          }
        response:
          mutatedEntities:
            CREATE: []
          guidAssignments: {}
      - key: example-1-3
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Connection
              attributes:
                name: open_lineage_connection
                connectorName: spark
                qualifiedName: default/spark/123456789
                category: connector
                defaultCredentialGuid: 8b579147-6054-4a4c-8137-463cd349b393
                adminRoles:
                  - e7ae0295-c60a-469a-bd2c-fb903943aa02
                adminGroups:
                  - group2
                adminUsers:
                  - jsmith
        response:
          mutatedEntities:
            CREATE:
              - typeName: Connection
                attributes:
                  qualifiedName: default/spark/123456789
                  name: open_lineage_connection
                guid: abcdef01-2345-6789-abcd-ef000000000000
                status: ACTIVE
          guidAssignments:
            "-1234567890": abcdef01-2345-6789-abcd-ef000000000000
