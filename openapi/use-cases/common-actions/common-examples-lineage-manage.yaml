                    guid: 495b1516-aaaf-4390-8cfd-b11ade7a7799
                  - typeName: Column
                    guid: d002dead-1655-4d75-abd6-ad889fa04bd4
                  - typeName: Column
                    uniqueAttributes:
                      qualifiedName: default/snowflake/1657025257/OPS/DEFAULT/RUN_STATS
                outputs:
                  - typeName: Column
