id: common-examples-certificates
title: Certify assets
category: common-actions
icon: zap
relatedTypes:
  - Asset
description: Manage asset certification status. Certificates indicate the quality or trustworthiness of data assets (e.g., Verified, Draft, Deprecated).
externalDocs:
  url: https://developer.atlan.com/snippets/common-examples/certificates/
  description: Official Atlan documentation
steps:
  - step: 1
    title: Add to an existing asset
    description: |-
      1.4.0 4.0.0
      To add a certificate to an existing asset:
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-1-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Table
              attributes:
                name: TOP_BEVERAGE_USERS
                qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                certificateStatus: VERIFIED
                certificateStatusMessage: Verified through automation.
        response:
          mutatedEntities:
            UPDATE:
              - typeName: Table
                attributes:
                  qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                  name: TOP_BEVERAGE_USERS
                  certificateStatus: VERIFIED
                  certificateStatusMessage: Verified through automation.
                guid: b9d5dbbc-ee8a-4c5e-a946-a47033892172
                status: ACTIVE
  - step: 2
    title: Remove from an existing asset
    description: |-
      1.4.0 4.0.0
      To remove a certificate from an existing asset:
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-2-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Table
              attributes:
                name: USER_ID
                qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS/USER_ID
                certificateStatus: null
                certificateStatusMessage: null
        response:
          mutatedEntities:
            DELETE:
              - typeName: Table
                attributes:
                  qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS/USER_ID
                  name: USER_ID
                guid: abcdef01-2345-6789-abcd-ef000000000000
                status: DELETED
  - step: 3
    title: When creating an asset
    description: |-
      2.0.0 4.0.0
      To add a certificate when creating an asset:
    method: POST
    endpoint: /api/meta/entity/bulk
    examples:
      - key: example-3-1
        summary: POST /api/meta/entity/bulk
        request:
          entities:
            - typeName: Table
              attributes:
                name: TOP_BEVERAGE_USERS
                qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                atlanSchema:
                  typeName: Schema
                  uniqueAttributes:
                    qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV
                certificateStatus: VERIFIED
                certificateStatusMessage: Verified at creation.
        response:
          mutatedEntities:
            CREATE:
              - typeName: Table
                attributes:
                  qualifiedName: default/snowflake/1657037873/SAMPLE_DB/FOOD_BEV/TOP_BEVERAGE_USERS
                  name: TOP_BEVERAGE_USERS
                  certificateStatus: VERIFIED
                guid: abcdef01-2345-6789-abcd-ef000000000000
                status: ACTIVE
          guidAssignments:
            "-1234567890": abcdef01-2345-6789-abcd-ef000000000000
