    title: "Run the search"
    description: >-
      2.0.2
      4.0.0
      
      For example, to initiate a search for pending tag propagation tasks related to a specific asset after a tag has been added:
    method: POST
    endpoint: /api/meta/task/search
    examples:
      - key: example-1-1
        summary: "POST /api/meta/task/search"
        request: {
                    "dsl": {
                              "from": 0,
                              "size": 20,
                              "query": {
                                        "bool": {
                                                  "filter": [
                                                            {
                                                                      "term": {
                                                                                "__task_entityGuid": {
                                                                                          "value": "f65e3da2-6ec2-4ff5-8f0b-b6eba640df24",
                                                                                          "case_insensitive": false
                                                                                }
                                                                      }
                                                            },
                                                            {
                                                                      "term": {
                                                                                "__task_type": {
                                                                                          "value": "CLASSIFICATION_PROPAGATION_ADD"
                                                                                }
                                                                      }
                                                            },
                                                            {
                                                                      "match": {
                                                                                "__task_status": {
                                                                                          "query": "PENDING"
                                                                                }
                                                                      }
                                                            }
                                                  ]
                                        }
                              },
                              "sort": [
                                        {
                                                  "__task_startTime": {
                                                            "order": "asc"
                                                  }
                                        }
                              ],
                              "track_total_hits": true
                    }
          }
