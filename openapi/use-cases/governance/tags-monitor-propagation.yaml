description: >-
  Monitor the propagation of Atlan tags through lineage and hierarchy using Atlan's background
  tasks queue. When you apply a tag with propagation enabled, Atlan creates background tasks
  to propagate the tag to downstream assets.


  **Task Types for Tag Propagation:**

  - `CLASSIFICATION_PROPAGATION_ADD`: Tag is being propagated to downstream assets

  - `CLASSIFICATION_PROPAGATION_DELETE`: Tag propagation is being removed


  **Task Statuses:**

  - `PENDING`: Task is queued but not yet started

  - `IN_PROGRESS`: Task is currently running

  - `COMPLETE`: Task finished successfully

  - `DELETED`: Task was cancelled or removed


  Use the `/api/meta/task/search` endpoint to query propagation status for specific assets.

